name: Release

on:
  push:
    tags:
      - 'v*'   # only tags like v0.1.0, v1.2.3, ...

permissions:
  contents: write   # needed to create releases and push back to the repo
  packages: write   # not used here but kept for completeness
  id-token: write   # needed for OIDC if you ever want to use it

jobs:
  build-release:
    runs-on: macOS-latest   # we need macOS to build the macOS bottles
    env:
      # The version without the leading "v", e.g. 0.2.0
      VERSION: ${{ github.ref_name }}
      REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v3
        with:
          # We need write access to push the updated formula back
          persist-credentials: false   # we'll use the GITHUB_TOKEN explicitly

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-unknown-linux-gnu   # for Linux bottle (built via cross)
          components: clippy, rustfmt

      - name: Install cross‑compilation linker for Linux (musl)
        # We'll build the Linux bottle using the `x86_64-unknown-linux-gnu` target
        # which uses the standard GNU toolchain that ships with the runners.
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Cache Cargo registry & build
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binaries for all targets
        run: |
          # macOS Intel
          cargo build --release --target x86_64-apple-darwin
          # macOS Apple Silicon
          cargo build --release --target aarch64-apple-darwin
          # Linux (using the cross target)
          cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package bottles
        run: |
          VERSION=${{ env.VERSION }}
          mkdir -p dist

          # macOS Intel
          mkdir -p toks-${VERSION}/bin
          cp target/x86_64-apple-darwin/release/toks toks-${VERSION}/bin/
          tar czf dist/toks-${VERSION}.x86_64.tar.gz -C toks-${VERSION} .

          # macOS ARM64
          mkdir -p toks-${VERSION}/bin
          cp target/aarch64-apple-darwin/release/toks toks-${VERSION}/bin/
          tar czf dist/toks-${VERSION}.arm64.tar.gz -C toks-${VERSION} .

          # Linux x86_64
          mkdir -p toks-${VERSION}/bin
          cp target/x86_64-unknown-linux-gnu/release/toks toks-${VERSION}/bin/
          tar czf dist/toks-${VERSION}.x86_64_linux.tar.gz -C toks-${VERSION} .

          # Also create the source tarball (needed for the formula’s url/sha256)
          git archive --format=tar.gz --prefix=toks-${VERSION}/ -o dist/toks-${VERSION}.tar.gz ${{ github.sha }}

      - name: Compute SHA256 of artifacts
        id: checksums
        run: |
          VERSION=${{ env.VERSION }}
          SOURCE_SHA=$(shasum -a 256 dist/toks-${VERSION}.tar.gz | awk '{print $1}')
          INTEL_SHA=$(shasum -a 256 dist/toks-${VERSION}.x86_64.tar.gz | awk '{print $1}')
          ARM64_SHA=$(shasum -a 256 dist/toks-${VERSION}.arm64.tar.gz | awk '{print $1}')
          LINUX_SHA=$(shasum -a 256 dist/toks-${VERSION}.x86_64_linux.tar.gz | awk '{print $1}')
          echo "SOURCE_SHA=$SOURCE_SHA" >> $GITHUB_OUTPUT
          echo "INTEL_SHA=$INTEL_SHA" >> $GITHUB_OUTPUT
          echo "ARM64_SHA=$ARM64_SHA" >> $GITHUB_OUTPUT
          echo "LINUX_SHA=$LINUX_SHA" >> $GITHUB_OUTPUT

      - name: Create (or update) GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets (bottles + source tarball)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/toks-${{ env.VERSION }}.tar.gz
            dist/toks-${{ env.VERSION }}.x86_64.tar.gz
            dist/toks-${{ env.VERSION }}.arm64.tar.gz
            dist/toks-${{ env.VERSION }}.x86_64_linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Formula/toks.rb
        run: |
          VERSION=${{ env.VERSION }}
          # Make sure the helper script is executable
          chmod +x .github/scripts/update-formula.sh
          # Run it – it will replace the source URL/sha256 and the three bottle SHA256s
          .github/scripts/update-formula.sh "${VERSION}"

      - name: Commit and push formula update
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add Formula/toks.rb
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Update formula to v${VERSION} [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to formula – nothing to commit."
          fi
        # Use the default GITHUB_TOKEN (already has write permission on the repo)