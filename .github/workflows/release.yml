name: Release

on:
  push:
    tags:
      - 'v*'   # only tags like v0.1.0, v1.2.3, ...

permissions:
  contents: write   # needed to create releases and push back to the repo

jobs:
  # ── 1. Build macOS binaries (Intel + Apple Silicon) ───────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build macOS binaries
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p staging
          cp target/x86_64-apple-darwin/release/toks staging/toks-x86_64-apple-darwin
          cp target/aarch64-apple-darwin/release/toks staging/toks-aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: staging/

  # ── 2. Build Linux binary ─────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Linux binary
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          mkdir -p staging
          cp target/x86_64-unknown-linux-gnu/release/toks staging/toks-x86_64-unknown-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: staging/

  # ── 3. Package, release, and update formula ───────────────────────────────
  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Strip version prefix (v0.1.0 → 0.1.0)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: artifacts/macos

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: artifacts/linux

      - name: Package bottles and source tarball
        run: |
          mkdir -p dist

          # macOS Intel
          mkdir -p pkg/bin
          cp artifacts/macos/toks-x86_64-apple-darwin pkg/bin/toks
          chmod +x pkg/bin/toks
          tar czf dist/toks-${VERSION}.x86_64.tar.gz -C pkg .
          rm -rf pkg

          # macOS ARM64
          mkdir -p pkg/bin
          cp artifacts/macos/toks-aarch64-apple-darwin pkg/bin/toks
          chmod +x pkg/bin/toks
          tar czf dist/toks-${VERSION}.arm64.tar.gz -C pkg .
          rm -rf pkg

          # Linux x86_64
          mkdir -p pkg/bin
          cp artifacts/linux/toks-x86_64-unknown-linux-gnu pkg/bin/toks
          chmod +x pkg/bin/toks
          tar czf dist/toks-${VERSION}.x86_64_linux.tar.gz -C pkg .
          rm -rf pkg

          # Source tarball (for formula url/sha256)
          git archive --format=tar.gz --prefix=toks-${VERSION}/ \
            -o dist/toks-${VERSION}.tar.gz ${{ github.sha }}

      - name: Compute SHA256 checksums
        id: checksums
        run: |
          echo "SOURCE_SHA=$(sha256sum dist/toks-${VERSION}.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "INTEL_SHA=$(sha256sum dist/toks-${VERSION}.x86_64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "ARM64_SHA=$(sha256sum dist/toks-${VERSION}.arm64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "LINUX_SHA=$(sha256sum dist/toks-${VERSION}.x86_64_linux.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/toks-${{ env.VERSION }}.tar.gz
            dist/toks-${{ env.VERSION }}.x86_64.tar.gz
            dist/toks-${{ env.VERSION }}.arm64.tar.gz
            dist/toks-${{ env.VERSION }}.x86_64_linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Formula/toks.rb
        env:
          SOURCE_SHA: ${{ steps.checksums.outputs.SOURCE_SHA }}
          ARM64_SHA: ${{ steps.checksums.outputs.ARM64_SHA }}
          INTEL_SHA: ${{ steps.checksums.outputs.INTEL_SHA }}
          LINUX_SHA: ${{ steps.checksums.outputs.LINUX_SHA }}
        run: |
          # Update source URL and sha256
          sed -i \
            -e "s|url \".*archive/refs/tags/v[^\"]*\"|url \"https://github.com/${REPO}/archive/refs/tags/v${VERSION}.tar.gz\"|" \
            -e "s|root_url \".*\"|root_url \"https://github.com/${REPO}/releases/download/v${VERSION}\"|" \
            Formula/toks.rb

          # Update source sha256 (2-space indent, no "cellar:" keyword)
          sed -i "s|^  sha256 \"[^\"]*\"|  sha256 \"${SOURCE_SHA}\"|" Formula/toks.rb

          # Update bottle sha256s
          sed -i \
            -e "s|sha256 cellar: :any_skip_relocation, arm64_ventura:.*|sha256 cellar: :any_skip_relocation, arm64_ventura:   \"${ARM64_SHA}\"|" \
            -e "s|sha256 cellar: :any_skip_relocation, x86_64_ventura:.*|sha256 cellar: :any_skip_relocation, x86_64_ventura:   \"${INTEL_SHA}\"|" \
            -e "s|sha256 cellar: :any_skip_relocation, x86_64_linux:.*|sha256 cellar: :any_skip_relocation, x86_64_linux:    \"${LINUX_SHA}\"|" \
            Formula/toks.rb

      - name: Commit and push formula update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/toks.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update formula to v${VERSION} [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes to formula – nothing to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
