[package]
name = "toks"
version = "0.1.0"
edition = "2021"
description = "TokenSlim — agent-agnostic CLI output compressor"
license = "MIT"
repository = "https://github.com/arkaung/toks"
keywords = ["cli", "llm", "token", "filter", "agentic"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap      = { version = "4", features = ["derive"] }
anyhow    = { version = "1.0", default-features = false, features = ["std"] }

[profile.release]
opt-level  = "z"
lto        = true
codegen-units = 1
strip      = true
panic      = "abort"